name: Build and Release AYDO Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "App version name (for example, 1.0.1)"
        required: true
        type: string
        default: "1.0.1"
      version_code:
        description: "Android version code (must be greater than the previous release)"
        required: true
        type: number
        default: 2
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build, sign, and publish AYDO APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Resolve release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            VERSION_NAME="${REF_NAME#v}"
            VERSION_CODE="$RUN_NUMBER"
          else
            VERSION_NAME="$INPUT_VERSION_NAME"
            VERSION_CODE="$INPUT_VERSION_CODE"
          fi

          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version name: $VERSION_NAME"
            exit 1
          fi
          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "Version code must be a positive integer."
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Configure permanent signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing GitHub secret: ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/android.keystore
          test -s android/android.keystore
          chmod 600 android/android.keystore

      - name: Update TWA version metadata
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          node -e '
            const fs = require("node:fs");
            const file = "twa-manifest.json";
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            manifest.appVersionName = process.env.VERSION_NAME;
            manifest.appVersionCode = Number(process.env.VERSION_CODE);
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n");
          '

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli@1.27.0

      - name: Configure Bubblewrap JDK and Android SDK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.bubblewrap"
          node -e '
            const fs = require("node:fs");
            const os = require("node:os");
            const path = require("node:path");
            const config = {
              jdkPath: process.env.JAVA_HOME,
              androidSdkPath: process.env.ANDROID_HOME
            };
            fs.writeFileSync(
              path.join(os.homedir(), ".bubblewrap", "config.json"),
              JSON.stringify(config, null, 2) + "\n"
            );
          '

      - name: Update Android project
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade

      - name: Build unsigned TWA APK
        working-directory: android
        run: bubblewrap build --skipSigning --skipPwaValidation

      - name: Align, sign, and verify APK
        working-directory: android
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"

          UNSIGNED_APK="$(find . -type f -name '*.apk' ! -name 'AYDO.apk' | sort | head -n 1)"
          if [ -z "$UNSIGNED_APK" ]; then
            echo "Bubblewrap did not produce an APK."
            find . -type f -print
            exit 1
          fi

          zipalign -f -v 4 "$UNSIGNED_APK" "$RUNNER_TEMP/AYDO-aligned.apk"
          apksigner sign \
            --ks "$GITHUB_WORKSPACE/android/android.keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$RUNNER_TEMP/AYDO.apk" \
            "$RUNNER_TEMP/AYDO-aligned.apk"
          apksigner verify --verbose --print-certs "$RUNNER_TEMP/AYDO.apk"
          zipalign -c -v 4 "$RUNNER_TEMP/AYDO.apk"

      - name: Upload APK artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: AYDO-APK-v${{ steps.version.outputs.version_name }}
          path: ${{ runner.temp }}/AYDO.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: AYDO v${{ steps.version.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ runner.temp }}/AYDO.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
